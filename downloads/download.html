<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ─── Reset & Variables ─────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --neon:      #bf00ff;
      --neon-dim:  rgba(191,0,255,.3);
      --bg:        #0a0a0a;
      --card-bg:   rgba(26,26,26,.85);
      --dark:      #1a1a1a;
      --fg:        #ffffff;
      --fg2:       #b0b0b0;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at top,    rgba(191,0,255,.12) 0%, transparent 55%),
        radial-gradient(ellipse at bottom, rgba(191,0,255,.06) 0%, transparent 55%);
      pointer-events: none; z-index: -1;
    }

    h1, h2, h3, .btn { font-family: 'Orbitron', sans-serif; }

    /* ─── Scrollbar ─────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg); }

    /* ─── Hero ──────────────────────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 60px 20px;
    }

    .hero-inner { max-width: 820px; }

    .logo-wrap { display: inline-block; margin-bottom: 32px; }

    .logo-img {
      width: 160px; height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--neon);
      box-shadow: 0 0 20px var(--neon), 0 0 45px var(--neon), inset 0 0 20px rgba(191,0,255,.2);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 20px var(--neon), 0 0 45px var(--neon), inset 0 0 20px rgba(191,0,255,.2); }
      50%      { box-shadow: 0 0 30px var(--neon), 0 0 70px var(--neon), inset 0 0 30px rgba(191,0,255,.3); }
    }

    /* fallback icon when no logo */
    .logo-placeholder {
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 4px solid var(--neon);
      background: var(--dark);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
      box-shadow: 0 0 20px var(--neon), 0 0 45px var(--neon);
      animation: pulse 3s ease-in-out infinite;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.8rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 14px;
      text-shadow: 0 0 10px var(--neon), 0 0 22px var(--neon), 0 0 40px var(--neon);
      animation: glitch 6s infinite;
    }

    @keyframes glitch {
      0%,89%,100% { text-shadow: 0 0 10px var(--neon), 0 0 22px var(--neon), 0 0 40px var(--neon); }
      92% { text-shadow: -2px 0 var(--neon), 0 0 22px var(--neon); }
      95% { text-shadow:  2px 0 var(--neon), 0 0 22px var(--neon); }
    }

    .hero-version {
      display: inline-block;
      font-family: 'Orbitron', sans-serif;
      font-size: .8rem;
      letter-spacing: 2px;
      color: var(--neon);
      border: 1px solid var(--neon-dim);
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .hero-desc {
      font-size: clamp(1rem,2vw,1.2rem);
      color: var(--fg2);
      margin-bottom: 40px;
      max-width: 600px;
      margin-left: auto; margin-right: auto;
    }

    /* ─── OS Compatibility badges ───────────────────────────────────── */
    .compat {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .compat-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1.5px solid;
      font-size: .82rem;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .compat-badge.supported {
      border-color: var(--neon);
      color: var(--fg);
      background: rgba(191,0,255,.08);
    }

    .compat-badge.unsupported {
      border-color: rgba(255,255,255,.15);
      color: rgba(255,255,255,.3);
    }

    .compat-badge.detected {
      border-color: var(--neon);
      background: rgba(191,0,255,.22);
      box-shadow: 0 0 12px var(--neon-dim);
    }

    .compat-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .supported .compat-dot  { background: var(--neon); box-shadow: 0 0 6px var(--neon); }
    .unsupported .compat-dot { background: rgba(255,255,255,.2); }

    /* ─── Download Buttons ──────────────────────────────────────────── */
    .dl-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 32px;
      border: 2px solid var(--neon);
      background: transparent;
      color: var(--fg);
      text-decoration: none;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all .25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(191,0,255,.15));
      opacity: 0; transition: opacity .25s;
    }

    .btn:hover { background: var(--neon); box-shadow: 0 0 22px var(--neon), inset 0 0 10px rgba(255,255,255,.15); transform: translateY(-3px); }
    .btn:hover::before { opacity: 1; }

    .btn.btn-primary { background: rgba(191,0,255,.18); }

    .btn.btn-disabled {
      opacity: .35;
      border-color: rgba(255,255,255,.2);
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* detected OS button gets extra glow */
    .btn.detected-os {
      box-shadow: 0 0 18px var(--neon-dim);
      border-color: var(--neon);
    }

    /* ─── Details Section ───────────────────────────────────────────── */
    .details-section {
      padding: 80px 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .section-title {
      font-size: clamp(1.8rem,3.5vw,2.8rem);
      text-align: center;
      margin-bottom: 60px;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: inline-block;
      position: relative;
      left: 50%; transform: translateX(-50%);
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      box-shadow: 0 0 10px var(--neon);
    }

    /* Features grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 70px;
    }

    .feature-card {
      background: var(--card-bg);
      border: 2px solid var(--neon-dim);
      border-radius: 14px;
      padding: 28px 24px;
      backdrop-filter: blur(10px);
      transition: all .3s ease;
      position: relative;
      overflow: hidden;
    }

    .feature-card::before {
      content: '';
      position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(191,0,255,.09), transparent);
      transition: left .5s ease;
    }
    .feature-card:hover::before { left: 100%; }
    .feature-card:hover { border-color: var(--neon); box-shadow: 0 8px 35px rgba(191,0,255,.35); transform: translateY(-6px); }

    .feature-icon { font-size: 2rem; margin-bottom: 14px; }
    .feature-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--neon); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .feature-desc  { color: var(--fg2); font-size: .95rem; line-height: 1.7; }

    /* Screenshots */
    .screenshots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 70px;
    }

    .screenshot {
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--neon-dim);
      transition: all .3s ease;
    }
    .screenshot:hover { border-color: var(--neon); box-shadow: 0 0 20px rgba(191,0,255,.45); transform: scale(1.02); }
    .screenshot img { width: 100%; display: block; height: 220px; object-fit: cover; }

    /* Requirements table */
    .req-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .95rem;
    }
    .req-table th, .req-table td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid var(--neon-dim);
    }
    .req-table th {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon);
      font-size: .8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .req-table td { color: var(--fg2); }
    .req-table tr:last-child td { border-bottom: none; }
    .req-table tbody tr { transition: background .2s; }
    .req-table tbody tr:hover { background: rgba(191,0,255,.06); }

    .req-wrapper {
      background: var(--card-bg);
      border: 2px solid var(--neon-dim);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    /* ─── Footer ────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--fg2);
      font-size: .85rem;
      border-top: 1px solid var(--neon-dim);
    }
    footer a { color: var(--neon); text-decoration: none; }
    footer a:hover { text-shadow: 0 0 8px var(--neon); }

    /* ─── Loading / Error ───────────────────────────────────────────── */
    .loading-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
      z-index: 9999;
      transition: opacity .4s ease;
    }
    .loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 60px; height: 60px;
      border: 3px solid var(--neon-dim);
      border-top-color: var(--neon);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Orbitron', sans-serif; color: var(--neon); letter-spacing: 3px; font-size: .9rem; }

    .error-box {
      max-width: 500px; margin: 100px auto; text-align: center; padding: 20px;
      background: var(--card-bg);
      border: 2px solid rgba(255,80,80,.4);
      border-radius: 14px;
      color: var(--fg2);
    }
    .error-box h2 { font-family: 'Orbitron', sans-serif; color: #ff5050; margin-bottom: 14px; }

    /* hide until loaded */
    .page-content { opacity: 0; transition: opacity .4s ease; }
    .page-content.visible { opacity: 1; }
  </style>
</head>
<body>

<!-- Loading screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading&hellip;</div>
</div>

<!-- Page (hidden until data loads) -->
<div class="page-content" id="pageContent">

  <!-- Hero -->
  <section class="hero">
    <div class="hero-inner">
      <div class="logo-wrap" id="logoWrap">
        <!-- filled by JS -->
      </div>
      <h1 id="heroTitle">Product Name</h1>
      <div class="hero-version" id="heroVersion">v1.0.0</div>
      <p class="hero-desc" id="heroDesc">Short description goes here.</p>

      <!-- OS compatibility badges -->
      <div class="compat" id="compatBadges"></div>

      <!-- Download buttons -->
      <div class="dl-buttons" id="dlButtons"></div>
    </div>
  </section>

  <!-- Details -->
  <section class="details-section">
    <div class="container">

      <!-- Features -->
      <div id="featuresBlock" style="display:none">
        <h2 class="section-title">Features</h2>
        <div class="features-grid" id="featuresGrid"></div>
      </div>

      <!-- Screenshots -->
      <div id="screenshotsBlock" style="display:none">
        <h2 class="section-title">Screenshots</h2>
        <div class="screenshots-grid" id="screenshotsGrid"></div>
      </div>

      <!-- Requirements -->
      <div id="requirementsBlock" style="display:none">
        <h2 class="section-title">Requirements</h2>
        <div class="req-wrapper">
          <table class="req-table">
            <thead><tr><th>Component</th><th>Minimum</th><th>Recommended</th></tr></thead>
            <tbody id="reqBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </section>

  <footer id="pageFooter"></footer>

</div><!-- /page-content -->

<div id="errorContainer"></div>

<script>

// ══════════════════════════════════════════════════════════════════════════════
//  OS DETECTION
// ══════════════════════════════════════════════════════════════════════════════
function detectOS() {
  const ua = navigator.userAgent.toLowerCase();
  const platform = (navigator.userAgentData?.platform || navigator.platform || '').toLowerCase();

  if (/iphone|ipad|ipod/.test(ua)) return 'ios';
  if (/android/.test(ua))          return 'android';
  if (/mac/.test(platform))        return 'mac';
  if (/linux/.test(platform))      return 'linux';
  if (/win/.test(platform))        return 'windows';
  return 'windows'; // safe default
}

// ══════════════════════════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════════════════════════
function render(data) {
  const detectedOS = detectOS();
  document.title = data.name || 'Download';

  // ── Logo ──────────────────────────────────────────────────────────────────
  const logoWrap = document.getElementById('logoWrap');
  if (data.logo) {
    logoWrap.innerHTML = `<img src="${data.logo}" alt="${data.name} logo" class="logo-img">`;
  } else {
    logoWrap.innerHTML = `<div class="logo-placeholder">${data.logo_emoji || '📦'}</div>`;
  }

  // ── Hero text ─────────────────────────────────────────────────────────────
  document.getElementById('heroTitle').textContent  = data.name        || '';
  document.getElementById('heroVersion').textContent = data.version     || '';
  document.getElementById('heroDesc').textContent    = data.description || '';

  // ── Compatibility badges ──────────────────────────────────────────────────
  const compatEl = document.getElementById('compatBadges');
  compatEl.innerHTML = '';
  const platforms = data.platforms || {};

  Object.entries(PLATFORM_META).forEach(([key, meta]) => {
    const cfg = platforms[key];
    if (!cfg) return; // platform not mentioned → skip badge
    const isDetected  = key === detectedOS;
    const isSupported = cfg.active;

    const badge = document.createElement('div');
    badge.className = 'compat-badge ' +
      (isSupported ? 'supported' : 'unsupported') +
      (isDetected && isSupported ? ' detected' : '');
    badge.innerHTML = `<span class="compat-dot"></span>${meta.label}${isDetected ? ' ✓' : ''}`;
    compatEl.appendChild(badge);
  });

  // ── Download buttons ──────────────────────────────────────────────────────
  const dlEl = document.getElementById('dlButtons');
  dlEl.innerHTML = '';

  // Sort so detected OS comes first
  const sorted = Object.entries(platforms).sort(([a],[b]) => {
    if (a === detectedOS) return -1;
    if (b === detectedOS) return  1;
    return 0;
  });

  sorted.forEach(([key, cfg]) => {
    if (!cfg.active) return; // hidden
    const meta = PLATFORM_META[key];
    if (!meta) return;

    const isDetected = key === detectedOS;
    const hasLink    = cfg.link && cfg.link.trim() !== '';

    const el = document.createElement('a');
    el.className = 'btn' +
      (isDetected ? ' btn-primary detected-os' : '') +
      (!hasLink   ? ' btn-disabled' : '');
    el.href   = hasLink ? cfg.link : '#';
    if (hasLink) { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
    el.innerHTML = meta.icon + `Download for ${meta.label}`;
    dlEl.appendChild(el);
  });

  // ── Features ──────────────────────────────────────────────────────────────
  if (data.features && data.features.length) {
    document.getElementById('featuresBlock').style.display = 'block';
    const grid = document.getElementById('featuresGrid');
    grid.innerHTML = '';
    data.features.forEach(f => {
      const card = document.createElement('div');
      card.className = 'feature-card';
      card.innerHTML = `
        <div class="feature-icon">${f.icon || '✦'}</div>
        <div class="feature-title">${f.title}</div>
        <div class="feature-desc">${f.description}</div>
      `;
      grid.appendChild(card);
    });
  }

  // ── Screenshots ───────────────────────────────────────────────────────────
  if (data.screenshots && data.screenshots.length) {
    document.getElementById('screenshotsBlock').style.display = 'block';
    const grid = document.getElementById('screenshotsGrid');
    grid.innerHTML = '';
    data.screenshots.forEach(s => {
      const wrap = document.createElement('div');
      wrap.className = 'screenshot';
      wrap.innerHTML = `<img src="${s.url}" alt="${s.alt || ''}" loading="lazy">`;
      grid.appendChild(wrap);
    });
  }

  // ── Requirements ──────────────────────────────────────────────────────────
  if (data.requirements && data.requirements.length) {
    document.getElementById('requirementsBlock').style.display = 'block';
    const tbody = document.getElementById('reqBody');
    tbody.innerHTML = '';
    data.requirements.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.component}</td><td>${r.min}</td><td>${r.recommended}</td>`;
      tbody.appendChild(tr);
    });
  }

  // ── Footer ────────────────────────────────────────────────────────────────
  document.getElementById('pageFooter').innerHTML = data.footer || '';
}


// ══════════════════════════════════════════════════════════════════════════════
//  INIT — load JSON from  ./hash.json  when a hash is present, else use fallback
// ══════════════════════════════════════════════════════════════════════════════
async function init() {
  const hash = window.location.hash.replace('#', '').trim();
  let data = FALLBACK_DATA;

  if (hash) {
    // Resolve relative to the current page directory
    const url  = `/projects/${hash}.json`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (err) {
      console.warn(`[download-template] Could not load "${url}":`, err);
      document.getElementById('errorContainer').innerHTML = `
        <div class="error-box">
          <h2>Config not found</h2>
          <p>Could not load <code>${hash}.json</code>. Showing fallback data.</p>
        </div>`;
      // fall through — render with FALLBACK_DATA
    }
  }

  render(data);

  // Fade in page, fade out loader
  const loader = document.getElementById('loadingScreen');
  const page   = document.getElementById('pageContent');
  loader.classList.add('fade-out');
  page.classList.add('visible');
  setTimeout(() => loader.style.display = 'none', 450);
}

init();
</script>
