<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockHunter Hub - Cyberpunk Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-purple: #bf00ff;
            --neon-glow: #bf00ff;
            --deep-black: #0a0a0a;
            --dark-grey: #1a1a1a;
            --card-bg: rgba(26, 26, 26, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--deep-black);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Advanced Background Effects */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(191, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 70%, rgba(191, 0, 255, 0.12) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, rgba(191, 0, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 80%, rgba(138, 0, 184, 0.1) 0%, transparent 35%),
                radial-gradient(ellipse at 90% 20%, rgba(138, 0, 184, 0.09) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: backgroundPulse 10s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* Animated Gradient Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .bg-orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(191, 0, 255, 0.4) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation: floatOrb1 20s ease-in-out infinite;
        }

        .bg-orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(138, 0, 184, 0.35) 0%, transparent 70%);
            bottom: -5%;
            right: -5%;
            animation: floatOrb2 18s ease-in-out infinite;
        }

        .bg-orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(191, 0, 255, 0.3) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: floatOrb3 22s ease-in-out infinite;
        }

        @keyframes floatOrb1 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(100px, 150px) scale(1.1);
            }
            66% {
                transform: translate(-50px, 100px) scale(0.9);
            }
        }

        @keyframes floatOrb2 {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(-120px, -100px) scale(1.15);
            }
            66% {
                transform: translate(80px, -150px) scale(0.85);
            }
        }

        @keyframes floatOrb3 {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        /* Grid Pattern Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(191, 0, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(191, 0, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(191, 0, 255, 0.02) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(4px);
            }
        }

        /* Glow Particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--neon-purple);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            box-shadow: 0 0 10px var(--neon-purple);
            opacity: 0;
            animation: particleFloat 15s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(100vh) translateX(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) translateX(100px);
            }
        }

        /* Content Container */
        .content-wrapper {
            position: relative;
            z-index: 2;
        }

        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(191, 0, 255, 0.15) 0%, transparent 70%);
            filter: blur(60px);
            animation: heroGlow 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes heroGlow {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-image-wrapper {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .hero-image-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(191, 0, 255, 0.3) 0%, transparent 70%);
            filter: blur(30px);
            animation: imageGlow 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes imageGlow {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
            }
        }

        .hero-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--neon-purple);
            box-shadow: 
                0 0 20px var(--neon-glow),
                0 0 40px var(--neon-glow),
                0 0 60px rgba(191, 0, 255, 0.5),
                inset 0 0 20px rgba(191, 0, 255, 0.2);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 
                    0 0 20px var(--neon-glow),
                    0 0 40px var(--neon-glow),
                    0 0 60px rgba(191, 0, 255, 0.5),
                    inset 0 0 20px rgba(191, 0, 255, 0.2);
            }
            50% {
                box-shadow: 
                    0 0 30px var(--neon-glow),
                    0 0 60px var(--neon-glow),
                    0 0 90px rgba(191, 0, 255, 0.7),
                    inset 0 0 30px rgba(191, 0, 255, 0.3);
            }
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                0 0 10px var(--neon-purple),
                0 0 20px var(--neon-purple),
                0 0 30px var(--neon-purple),
                0 0 40px rgba(191, 0, 255, 0.5);
            animation: glitchText 5s infinite;
        }

        @keyframes glitchText {
            0%, 90%, 100% {
                text-shadow: 
                    0 0 10px var(--neon-purple),
                    0 0 20px var(--neon-purple),
                    0 0 30px var(--neon-purple),
                    0 0 40px rgba(191, 0, 255, 0.5);
            }
            93% {
                text-shadow: 
                    -2px 0 var(--neon-purple),
                    0 0 20px var(--neon-purple);
            }
            95% {
                text-shadow: 
                    2px 0 var(--neon-purple),
                    0 0 20px var(--neon-purple);
            }
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-secondary);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(191, 0, 255, 0.3);
        }

        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 2px solid var(--neon-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.2);
        }

        .social-link:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 5px 20px rgba(191, 0, 255, 0.5),
                0 0 30px rgba(191, 0, 255, 0.4),
                0 0 40px rgba(191, 0, 255, 0.3);
            border-color: var(--text-primary);
        }

        .social-link img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(191, 0, 255, 0.5));
        }

        /* Projects Section */
        .projects-section {
            padding: 80px 20px;
            min-height: 100vh;
            position: relative;
        }

        .projects-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 300px;
            background: radial-gradient(ellipse, rgba(191, 0, 255, 0.1) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3rem);
            text-align: center;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
            text-shadow: 
                0 0 10px var(--neon-purple),
                0 0 20px rgba(191, 0, 255, 0.5);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-purple), transparent);
            box-shadow: 
                0 0 10px var(--neon-purple),
                0 0 20px rgba(191, 0, 255, 0.5);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .projects-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .project-card {
            background: var(--card-bg);
            border: 2px solid rgba(191, 0, 255, 0.3);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.1);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(191, 0, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .project-card:hover::before {
            left: 100%;
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-purple);
            box-shadow: 
                0 10px 40px rgba(191, 0, 255, 0.4),
                0 0 30px rgba(191, 0, 255, 0.3),
                0 0 50px rgba(191, 0, 255, 0.2);
        }

        .project-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .project-content {
            padding: 25px;
        }

        .project-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--neon-purple);
            text-shadow: 
                0 0 10px rgba(191, 0, 255, 0.5),
                0 0 20px rgba(191, 0, 255, 0.3);
        }

        .project-description {
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.6;
        }

        .project-button {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--neon-purple);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(191, 0, 255, 0.2);
        }

        .project-button:hover {
            background: var(--neon-purple);
            box-shadow: 
                0 0 20px var(--neon-purple),
                0 0 30px rgba(191, 0, 255, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .modal-content {
            background: var(--dark-grey);
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 
                0 0 50px rgba(191, 0, 255, 0.6),
                0 0 80px rgba(191, 0, 255, 0.4),
                inset 0 0 30px rgba(191, 0, 255, 0.1);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 30px;
            border-bottom: 2px solid rgba(191, 0, 255, 0.3);
            position: relative;
            box-shadow: 0 5px 20px rgba(191, 0, 255, 0.1);
        }

        .modal-title {
            font-size: 2rem;
            color: var(--neon-purple);
            margin-bottom: 10px;
            text-shadow: 
                0 0 10px rgba(191, 0, 255, 0.5),
                0 0 20px rgba(191, 0, 255, 0.3);
        }

        .modal-updated {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-purple);
            background: transparent;
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 10px rgba(191, 0, 255, 0.3);
        }

        .close-modal:hover {
            background: var(--neon-purple);
            transform: rotate(90deg);
            box-shadow: 
                0 0 20px var(--neon-purple),
                0 0 30px rgba(191, 0, 255, 0.5);
        }

        .modal-body {
            padding: 30px;
        }

        .modal-description {
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .modal-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .modal-gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid rgba(191, 0, 255, 0.3);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.2);
        }

        .modal-gallery img:hover {
            border-color: var(--neon-purple);
            box-shadow: 
                0 0 20px rgba(191, 0, 255, 0.5),
                0 0 30px rgba(191, 0, 255, 0.3);
            transform: scale(1.05);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--deep-black);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 5px;
            box-shadow: 0 0 10px var(--neon-purple);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-primary);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 1.5rem;
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(191, 0, 255, 0.5);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <!-- Animated Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    
    <!-- Grid Overlay -->
    <div class="grid-overlay"></div>
    
    <!-- Scanlines -->
    <div class="scanlines"></div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-image-wrapper">
                    <img src="assets/socials/main.png" alt="Profile" class="hero-image" id="heroImage">
                </div>
                <h1>Welcome to the Hub</h1>
                <p>Enter the Cyberpunk Portfolio Experience</p>
                <div class="social-links" id="socialLinks"></div>
            </div>
        </section>

        <!-- Projects Section -->
        <section class="projects-section">
            <div class="container">
                <h2 class="section-title">Projects</h2>
                <div class="projects-grid" id="projectsGrid">
                    <div class="loading">Loading projects</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-updated" id="modalUpdated"></p>
                <button class="close-modal" id="closeModal">×</button>
            </div>
            <div class="modal-body">
                <p class="modal-description" id="modalDescription"></p>
                <div class="modal-gallery" id="modalGallery"></div>
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                document.body.appendChild(particle);
            }
        }

        // State
        let projectsData = {};

        // Fetch data
        async function fetchData() {
            try {
                const response = await fetch('assets/data.json');
                if (!response.ok) throw new Error('Failed to fetch data');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('projectsGrid').innerHTML = 
                    '<p style="text-align: center; color: var(--text-secondary);">Failed to load projects. Please check the data.json file.</p>';
                return null;
            }
        }

        // Render social links
        function renderSocials(socials) {
            const container = document.getElementById('socialLinks');
            container.innerHTML = '';

            if (!socials) return;

            Object.entries(socials).forEach(([key, value]) => {
                if (value && value !== 'none') {
                    const link = document.createElement('a');
                    link.href = value;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'social-link';
                    link.innerHTML = `<img src="assets/socials/${key}.png" alt="${key}" onerror="this.style.display='none'">`;
                    container.appendChild(link);
                }
            });
        }

        // Render projects
        function renderProjects(projects) {
            const container = document.getElementById('projectsGrid');
            container.innerHTML = '';

            if (!projects || Object.keys(projects).length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No projects found.</p>';
                return;
            }

            Object.entries(projects).forEach(([key, project]) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.dataset.projectKey = key;

                const imagePath = project.header_image 
                    ? `assets/${key}/${project.header_image}` 
                    : 'assets/placeholder.png';

                card.innerHTML = `
                    <img src="${imagePath}" alt="${project.project_name}" class="project-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22250%22%3E%3Crect fill=%22%231a1a1a%22 width=%22300%22 height=%22250%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23bf00ff%22 font-family=%22Orbitron%22 font-size=%2220%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                    <div class="project-content">
                        <h3 class="project-title">${project.project_name}</h3>
                        <p class="project-description">${project.description}</p>
                        <a href="${project.url}" target="_blank" rel="noopener noreferrer" class="project-button" onclick="event.stopPropagation()">View Project</a>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('project-button')) {
                        openModal(key, project);
                    }
                });

                container.appendChild(card);
            });
        }

        // Open modal
        function openModal(projectKey, project) {
            const modal = document.getElementById('projectModal');
            const title = document.getElementById('modalTitle');
            const updated = document.getElementById('modalUpdated');
            const description = document.getElementById('modalDescription');
            const gallery = document.getElementById('modalGallery');

            title.textContent = project.project_name;
            updated.textContent = `Last Updated: ${project.last_updated}`;
            description.textContent = project.description;

            // Gallery
            gallery.innerHTML = '';
            if (project.images && project.images.length > 0) {
                project.images.forEach(img => {
                    const imgElement = document.createElement('img');
                    imgElement.src = `assets/${projectKey}/${img}`;
                    imgElement.alt = project.project_name;
                    imgElement.onerror = function() { this.style.display = 'none'; };
                    gallery.appendChild(imgElement);
                });
            } else if (project.header_image) {
                const imgElement = document.createElement('img');
                imgElement.src = `assets/${projectKey}/${project.header_image}`;
                imgElement.alt = project.project_name;
                imgElement.onerror = function() { this.style.display = 'none'; };
                gallery.appendChild(imgElement);
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('projectModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Event listeners
        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('projectModal').addEventListener('click', (e) => {
            if (e.target.id === 'projectModal') {
                closeModal();
            }
        });

        // Escape key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize
        async function init() {
            createParticles();
            const data = await fetchData();
            if (data) {
                projectsData = data.projects;
                renderSocials(data.socials);
                renderProjects(data.projects);
            }
        }

        // Run on load
        init();
    </script>
</body>
</html>
