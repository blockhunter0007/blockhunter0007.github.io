<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary – by Blockhunter Software</title>
<meta name="description" content="A quiet place for your thoughts. Private, offline, and just for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@300;400;500;600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ─── CSS Variables ─────────────────────────────────────── */
:root {
  --bg: #fdf8f5;
  --bg2: #fef0f4;
  --surface: rgba(255,255,255,0.72);
  --surface2: rgba(255,240,248,0.6);
  --border: rgba(220,180,200,0.3);
  --text: #3a2a35;
  --text-soft: #7a5a6a;
  --text-muted: #b08898;
  --accent: #e87fa0;
  --accent2: #c97bb8;
  --accent-soft: rgba(232,127,160,0.15);
  --accent-glow: rgba(232,127,160,0.3);
  --gold: #d4956a;
  --radius: 20px;
  --radius-lg: 32px;
  --shadow: 0 4px 32px rgba(180,100,130,0.12);
  --shadow-lg: 0 12px 60px rgba(180,100,130,0.18);
  --font-body: 'Nunito', sans-serif;
  --font-serif: 'Lora', serif;
  --font-hand: 'Caveat', cursive;
  --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

[data-theme="dark"] {
  --bg: #16101c;
  --bg2: #1e1428;
  --surface: rgba(36,24,48,0.85);
  --surface2: rgba(48,30,64,0.6);
  --border: rgba(140,80,180,0.2);
  --text: #f0e4f5;
  --text-soft: #c4a8d8;
  --text-muted: #8a6aa0;
  --accent: #c67de8;
  --accent2: #9b6ec4;
  --accent-soft: rgba(198,125,232,0.12);
  --accent-glow: rgba(198,125,232,0.25);
  --gold: #e8b87a;
  --shadow: 0 4px 32px rgba(100,40,140,0.3);
  --shadow-lg: 0 12px 60px rgba(100,40,140,0.4);
}

/* ─── Reset & Base ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

/* ─── Typography ────────────────────────────────────────── */
h1, h2, h3 { font-family: var(--font-serif); font-weight: 500; line-height: 1.25; }
h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); }
h2 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); }
h3 { font-size: 1.1rem; }
p { font-size: 1rem; color: var(--text-soft); }

.hand { font-family: var(--font-hand); }

/* ─── Background Canvas ─────────────────────────────────── */
#bg-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.55;
}

/* ─── Countdown Overlay ─────────────────────────────────── */
#countdown-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: opacity 1.2s ease, transform 1.2s ease;
}

#countdown-overlay.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
}

.cd-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 40%, #3a1a4e 0%, #1a0d28 60%, #0e0818 100%);
}

[data-theme="dark"] .cd-bg {
  background: radial-gradient(ellipse at 50% 40%, #2d1242 0%, #160825 60%, #0a0514 100%);
}

#cd-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.cd-inner {
  position: relative;
  z-index: 2;
  text-align: center;
  color: #f0e0ff;
  padding: 2rem;
}

.cd-title {
  font-family: var(--font-hand);
  font-size: clamp(2.5rem, 8vw, 5rem);
  color: #f8eaff;
  text-shadow: 0 0 40px rgba(200,120,255,0.6), 0 0 80px rgba(200,120,255,0.3);
  margin-bottom: 0.5rem;
  animation: pulse-glow 3s ease-in-out infinite;
}

.cd-subtitle {
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: rgba(220,180,255,0.7);
  margin-bottom: 3rem;
  letter-spacing: 0.05em;
}

.cd-tagline {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  color: rgba(245,210,255,0.85);
  margin-bottom: 3.5rem;
  max-width: 480px;
  line-height: 1.5;
}

.cd-units {
  display: flex;
  gap: clamp(1rem, 4vw, 3rem);
  justify-content: center;
  margin-bottom: 2.5rem;
}

.cd-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}

.cd-num {
  font-family: var(--font-serif);
  font-size: clamp(2.5rem, 7vw, 5rem);
  font-weight: 600;
  color: #fff;
  line-height: 1;
  text-shadow: 0 0 30px rgba(200,120,255,0.8);
  background: linear-gradient(135deg, #f0d8ff, #d4a0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  min-width: 2ch;
  text-align: center;
  transition: transform 0.15s ease;
}

.cd-num.tick { transform: scale(1.08); }

.cd-label {
  font-family: var(--font-body);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(200,160,255,0.6);
}

.cd-sep {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: rgba(200,120,255,0.4);
  line-height: 1;
  margin-top: 0.1rem;
  animation: blink 1s step-end infinite;
}

.cd-hearts {
  display: flex;
  gap: 1rem;
  justify-content: center;
  font-size: 1.5rem;
}

.cd-heart {
  animation: float-heart 3s ease-in-out infinite;
  display: inline-block;
  filter: drop-shadow(0 0 8px rgba(255,150,200,0.7));
}

.cd-heart:nth-child(2) { animation-delay: 0.8s; }
.cd-heart:nth-child(3) { animation-delay: 1.6s; }

/* ─── Heart Explosion ───────────────────────────────────── */
.exploding-heart {
  position: fixed;
  pointer-events: none;
  z-index: 10000;
  font-size: 2rem;
  animation: explode-heart 1.2s ease-out forwards;
}

@keyframes explode-heart {
  0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
  60% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
}

/* ─── Layout ────────────────────────────────────────────── */
.wrapper {
  position: relative;
  z-index: 1;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 clamp(1.2rem, 5vw, 3rem);
}

/* ─── Nav ───────────────────────────────────────────────── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 1.2rem 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  background: rgba(253,248,245,0.8);
  transition: background var(--transition);
}

[data-theme="dark"] nav {
  background: rgba(22,16,28,0.85);
}

.nav-inner {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
}

.nav-logo-link {
  font-family: var(--font-hand);
  font-size: 1.1rem;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-logo-link:hover { color: var(--accent); }

.nav-center {
  text-align: center;
}

.nav-title {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 20px var(--accent-glow);
}

.nav-by {
  font-family: var(--font-hand);
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 0.1rem;
}

.nav-right {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.theme-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.45rem 1rem;
  font-family: var(--font-body);
  font-size: 0.82rem;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.theme-btn:hover, .theme-btn:focus-visible {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}

/* ─── Snip (tiny emotional snippets) ───────────────────── */
.snip {
  font-family: var(--font-hand);
  font-size: 1rem;
  color: var(--text-muted);
  text-align: center;
  padding: 0.6rem 0;
  opacity: 0.85;
  font-style: italic;
}

/* ─── Sections ──────────────────────────────────────────── */
section { padding: clamp(4rem, 8vw, 7rem) 0; }

/* ─── Hero ──────────────────────────────────────────────── */
.hero {
  min-height: 90vh;
  display: flex;
  align-items: center;
  padding: 5rem 0 4rem;
  position: relative;
}

.hero-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 2rem;
}

.hero-label {
  font-family: var(--font-hand);
  font-size: 1.05rem;
  color: var(--accent);
  letter-spacing: 0.05em;
  opacity: 0.85;
}

.hero-headline {
  max-width: 780px;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 60%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  max-width: 540px;
  font-size: 1.1rem;
  line-height: 1.8;
  color: var(--text-soft);
}

.hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  justify-content: center;
  margin-top: 0.5rem;
}

.badge {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.35rem 0.9rem;
  font-size: 0.78rem;
  color: var(--text-soft);
  letter-spacing: 0.03em;
}

.hero-cta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  margin-top: 0.5rem;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 1rem 2.4rem;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  box-shadow: 0 6px 30px var(--accent-glow), 0 2px 8px rgba(0,0,0,0.1);
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}

.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.15);
  opacity: 0;
  transition: opacity 0.2s;
}

.btn-primary:hover::after, .btn-primary:focus-visible::after { opacity: 1; }
.btn-primary:hover, .btn-primary:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 10px 40px var(--accent-glow);
  outline: none;
}

.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.7rem 1.6rem;
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--text-soft);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.2s;
  backdrop-filter: blur(8px);
}

.btn-secondary:hover, .btn-secondary:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
  outline: none;
}

.hero-note {
  font-family: var(--font-hand);
  font-size: 0.9rem;
  color: var(--text-muted);
}

/* ─── Download Section ──────────────────────────────────── */
.download-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(2rem, 5vw, 3.5rem);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  text-align: center;
  max-width: 680px;
  margin: 0 auto;
}

.download-os-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.7rem;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 1.1rem 2.8rem;
  font-family: var(--font-body);
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 6px 30px var(--accent-glow);
  transition: all 0.25s;
  margin-bottom: 1.5rem;
}
.download-os-btn:hover, .download-os-btn:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 10px 40px var(--accent-glow);
  outline: none;
}

.dl-alts {
  display: flex;
  gap: 0.8rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 1.2rem;
}

.dl-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  justify-content: center;
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}

.dl-pill {
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.3rem 0.85rem;
  font-size: 0.78rem;
  color: var(--text-soft);
}

.dl-donation-note {
  margin-top: 1.5rem;
  font-family: var(--font-hand);
  font-size: 0.92rem;
  color: var(--text-muted);
}

/* ─── Section headers ───────────────────────────────────── */
.section-head {
  text-align: center;
  margin-bottom: clamp(2.5rem, 5vw, 4rem);
}

.section-head h2 { margin-bottom: 0.6rem; }
.section-head p { max-width: 520px; margin: 0 auto; }

/* ─── Features ──────────────────────────────────────────── */
.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.2rem;
}

.feature-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.6rem;
  backdrop-filter: blur(12px);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.feature-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: 0;
  transition: opacity 0.3s;
}

.feature-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.feature-card:hover::before { opacity: 1; }

.feature-card.highlighted {
  border-color: var(--accent);
  box-shadow: var(--shadow), 0 0 0 1px var(--accent-soft);
}

.feature-card.highlighted::before { opacity: 1; }

.feature-icon { font-size: 1.8rem; margin-bottom: 0.8rem; display: block; }
.feature-card h3 { color: var(--text); margin-bottom: 0.4rem; font-family: var(--font-body); font-weight: 600; }
.feature-card p { font-size: 0.88rem; }

/* ─── FAQ ───────────────────────────────────────────────── */
.faq-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

@media (max-width: 700px) {
  .faq-grid { grid-template-columns: 1fr; }
  .nav-inner { grid-template-columns: auto 1fr auto; }
  .nav-logo-link { font-size: 0.85rem; }
}

.faq-col-label {
  font-family: var(--font-hand);
  font-size: 0.95rem;
  color: var(--text-muted);
  margin-bottom: 1.2rem;
  letter-spacing: 0.05em;
}

.faq-item {
  border-bottom: 1px solid var(--border);
  padding: 1.2rem 0;
  cursor: pointer;
}

.faq-item:first-of-type { border-top: 1px solid var(--border); }

.faq-q {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  font-weight: 500;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.95rem;
}

.faq-arrow {
  flex-shrink: 0;
  color: var(--accent);
  font-size: 0.9rem;
  transition: transform 0.25s;
}

.faq-item.open .faq-arrow { transform: rotate(180deg); }

.faq-a {
  font-size: 0.9rem;
  color: var(--text-soft);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, padding 0.3s;
  padding-top: 0;
}

.faq-item.open .faq-a {
  max-height: 300px;
  padding-top: 0.8rem;
}

/* ─── About ─────────────────────────────────────────────── */
.about-card {
  max-width: 700px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(2rem, 5vw, 3.5rem);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.about-card::after {
  content: '♡';
  position: absolute;
  bottom: -1.5rem;
  right: 2rem;
  font-size: 8rem;
  color: var(--accent-soft);
  line-height: 1;
  pointer-events: none;
}

.about-header {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  margin-bottom: 2rem;
}

.about-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  flex-shrink: 0;
  box-shadow: 0 4px 20px var(--accent-glow);
}

.about-name {
  font-family: var(--font-hand);
  font-size: 1.3rem;
  color: var(--text);
  display: block;
}

.about-role {
  font-size: 0.82rem;
  color: var(--text-muted);
}

.about-body p {
  color: var(--text-soft);
  line-height: 1.9;
  margin-bottom: 1.2rem;
}

.about-body p:last-child { margin-bottom: 0; }

.about-body em {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--text);
}

/* ─── Contact ───────────────────────────────────────────── */
.contact-box {
  text-align: center;
  max-width: 560px;
  margin: 0 auto;
}
.contact-box p { margin-bottom: 2rem; font-size: 1.05rem; line-height: 1.8; }

/* ─── Divider ───────────────────────────────────────────── */
.divider {
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  margin: 0 auto;
  opacity: 0.5;
}

/* ─── Footer ────────────────────────────────────────────── */
footer {
  border-top: 1px solid var(--border);
  padding: 3rem 0 2rem;
  position: relative;
  overflow: hidden;
}

.footer-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  text-align: center;
}

.footer-logo {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: var(--accent);
  margin-bottom: 0.2rem;
}

.footer-tagline {
  font-family: var(--font-hand);
  font-size: 1rem;
  color: var(--text-muted);
  font-style: italic;
}

.footer-links {
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
  justify-content: center;
}

.footer-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  transition: color 0.2s;
}
.footer-links a:hover, .footer-links a:focus-visible {
  color: var(--accent);
  outline: none;
}

.footer-copy {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.footer-privacy {
  font-size: 0.82rem;
  color: var(--text-muted);
  max-width: 440px;
  line-height: 1.6;
}

/* ─── Scroll reveal ─────────────────────────────────────── */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.reveal.visible {
  opacity: 1;
  transform: none;
}

/* ─── Keyframes ─────────────────────────────────────────── */
@keyframes float-up {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  5% { opacity: 1; }
  95% { opacity: 0.7; }
  100% { transform: translateY(-20px) rotate(360deg); opacity: 0; }
}

function buildFaqCol(items, label, isEmotional) {
  const col = document.createElement('div');
  const lbl = document.createElement('p');
  lbl.className = 'faq-col-label';
  lbl.textContent = label;
  col.appendChild(lbl);
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'faq-item';
    div.setAttribute('tabindex', '0');
    div.setAttribute('role', 'button');
    div.setAttribute('aria-expanded', 'false');
    div.innerHTML = `<div class="faq-q">${item.q}<span class="faq-arrow" aria-hidden="true">▾</span></div><div class="faq-a">${item.a}</div>`;
    div.addEventListener('click', () => toggleFaq(div));
    div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFaq(div); } });
    col.appendChild(div);
  });
  return col;
}

function toggleFaq(el) {
  const isOpen = el.classList.contains('open');
  el.classList.toggle('open', !isOpen);
  el.setAttribute('aria-expanded', String(!isOpen));
}

const emotionalLabel = lang === 'de' ? '💛 Persönliche Fragen' : '💛 Personal questions';
const techLabel = lang === 'de' ? '🔧 Technische Details' : '🔧 Technical details';
faqGrid.appendChild(buildFaqCol(t.faq_emotional, emotionalLabel, true));
faqGrid.appendChild(buildFaqCol(t.faq_technical, techLabel, false));

/* ═══════════════════════════════════════════════════════════
   BACKGROUND PARTICLES
═══════════════════════════════════════════════════════════ */
(function bgParticles() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const easterEggs = [
    'you are awesome.', "i'm glad you're here.", 'take care of yourself.',
    'you survived every bad day so far.', 'you matter.', 'keep going.',
    'you deserve safe spaces too.'
  ];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function randomType() {
    const r = Math.random();
    if (r < 0.80) return 'heart';
    if (r < 0.90) return 'star';
    if (r < 0.99) return 'lock';
    return 'egg';
  }

  function createParticle() {
    const type = randomType();
    return {
      type,
      x: Math.random() * W,
      y: H + 30,
      size: type === 'egg' ? 12 : (8 + Math.random() * 14),
      speed: 0.3 + Math.random() * 0.6,
      drift: (Math.random() - 0.5) * 0.4,
      opacity: 0,
      maxOpacity: 0.12 + Math.random() * 0.18,
      fadeIn: true,
      text: type === 'egg' ? easterEggs[Math.floor(Math.random() * easterEggs.length)] : '',
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01,
    };
  }

  function getSymbol(type) {
    if (type === 'heart') return '♡';
    if (type === 'star') return '✦';
    if (type === 'lock') return '🔒';
    return '';
  }

  function getColor(type) {
    if (isDark) {
      if (type === 'heart') return `rgba(198,125,232,${0.6})`;
      if (type === 'star') return `rgba(220,180,255,${0.5})`;
      return `rgba(150,100,200,${0.4})`;
    } else {
      if (type === 'heart') return `rgba(232,127,160,${0.6})`;
      if (type === 'star') return `rgba(212,149,106,${0.5})`;
      return `rgba(180,100,140,${0.4})`;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      if (p.type === 'egg') {
        ctx.font = `${p.size}px 'Caveat', cursive`;
        ctx.fillStyle = isDark ? 'rgba(220,180,255,0.5)' : 'rgba(180,100,140,0.4)';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, 0, 0);
      } else if (p.type === 'lock') {
        ctx.font = `${p.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('🔒', 0, 0);
      } else {
        ctx.font = `${p.size}px serif`;
        ctx.fillStyle = getColor(p.type);
        ctx.textAlign = 'center';
        ctx.fillText(getSymbol(p.type), 0, 0);
      }
      ctx.restore();
    });
  }

  function tick() {
    if (!prefersReducedMotion) {
      particles.forEach((p, i) => {
        p.y -= p.speed;
        p.x += p.drift;
        p.rotation += p.rotSpeed;
        if (p.fadeIn) {
          p.opacity = Math.min(p.opacity + 0.008, p.maxOpacity);
          if (p.opacity >= p.maxOpacity) p.fadeIn = false;
        }
        if (p.y < -50) particles.splice(i, 1);
      });
      if (particles.length < 60 && Math.random() < 0.3) particles.push(createParticle());
    }
    draw();
    requestAnimationFrame(tick);
  }

  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 40; i++) {
    const p = createParticle();
    p.y = Math.random() * H;
    p.opacity = Math.random() * p.maxOpacity;
    p.fadeIn = false;
    particles.push(p);
  }
  tick();
})();

/* ═══════════════════════════════════════════════════════════
   COUNTDOWN
═══════════════════════════════════════════════════════════ */
(function countdown() {
  const overlay = document.getElementById('countdown-overlay');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Countdown particles canvas
  const cdCanvas = document.getElementById('cd-canvas');
  const cdCtx = cdCanvas.getContext('2d');
  let cdParticles = [];

  function resizeCd() {
    cdCanvas.width = window.innerWidth;
    cdCanvas.height = window.innerHeight;
  }
  resizeCd();
  window.addEventListener('resize', resizeCd);

  function spawnCdParticle() {
    const W = cdCanvas.width, H = cdCanvas.height;
    return {
      x: Math.random() * W,
      y: H + 10,
      size: 8 + Math.random() * 16,
      speed: 0.5 + Math.random() * 1.2,
      drift: (Math.random() - 0.5) * 0.8,
      opacity: 0,
      maxOpacity: 0.3 + Math.random() * 0.5,
      type: Math.random() < 0.7 ? '♡' : (Math.random() < 0.5 ? '✦' : '·'),
    };
  }

  function animateCd() {
    const W = cdCanvas.width, H = cdCanvas.height;
    cdCtx.clearRect(0, 0, W, H);
    cdParticles.forEach((p, i) => {
      p.y -= p.speed;
      p.x += p.drift;
      p.opacity = Math.min(p.opacity + 0.015, p.maxOpacity);
      if (p.y < -20) cdParticles.splice(i, 1);
      cdCtx.globalAlpha = p.opacity;
      cdCtx.font = `${p.size}px serif`;
      cdCtx.fillStyle = `rgba(220,160,255,0.8)`;
      cdCtx.textAlign = 'center';
      cdCtx.fillText(p.type, p.x, p.y);
    });
    if (cdParticles.length < 80 && Math.random() < 0.4) cdParticles.push(spawnCdParticle());
    if (!isReleased) requestAnimationFrame(animateCd);
  }

  if (!prefersReducedMotion) animateCd();

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = Date.now();
    const diff = RELEASE_DATE.getTime() - now;

    if (diff <= 0) {
      triggerRelease();
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    document.getElementById('cd-days').textContent = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent = pad(mins);
    document.getElementById('cd-secs').textContent = pad(secs);

    if (secs !== prevSecs && !prefersReducedMotion) {
      const el = document.getElementById('cd-secs');
      el.classList.add('tick');
      setTimeout(() => el.classList.remove('tick'), 120);
      prevSecs = secs;
    }

    setTimeout(tick, 250);
  }

  function triggerRelease() {
    if (isReleased) return;
    isReleased = true;

    // Try audio
    try {
      const audio = new Audio('assets/release.ogg');
      audio.volume = 0.5;
      audio.play().catch(() => {});
    } catch (e) {}

    // Heart explosion
    if (!prefersReducedMotion) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const hearts = ['💜', '🤍', '💖', '✨', '💫', '🌸', '💕', '⭐'];

      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'exploding-heart';
          const angle = Math.random() * Math.PI * 2;
          const dist = 150 + Math.random() * 350;
          el.style.cssText = `left:${cx}px;top:${cy}px;--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;--rot:${(Math.random()-0.5)*720}deg;font-size:${1.2+Math.random()*1.5}rem;`;
          el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1400);
        }, i * 30);
      }
    }

    // Hide overlay
    setTimeout(() => {
      overlay.classList.add('hidden');
      overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    }, prefersReducedMotion ? 0 : 1200);
  }

  tick();
})();

/* ═══════════════════════════════════════════════════════════
   SCROLL REVEAL
═══════════════════════════════════════════════════════════ */
(function scrollReveal() {
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReducedMotion) {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
})();
</script>
