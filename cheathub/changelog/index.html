<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog - Cheathub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.3s ease;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.3);
        }

        .logo:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b19cd9;
            font-size: 1.1rem;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            color: #c77dff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #5a189a;
        }

        .version-card {
            background: rgba(26, 10, 46, 0.6);
            border: 1px solid #5a189a;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .version-card:hover {
            border-color: #9d4edd;
            box-shadow: 0 8px 32px rgba(157, 78, 221, 0.2);
        }

        .version-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(90, 24, 154, 0.1);
        }

        .version-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .version-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #c77dff;
        }

        .version-date {
            color: #b19cd9;
            font-size: 0.9rem;
        }

        .expand-icon {
            font-size: 1.5rem;
            color: #9d4edd;
            transition: transform 0.3s ease;
        }

        .version-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .version-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .version-card.expanded .version-content {
            max-height: 2000px;
        }

        .changes-section {
            padding: 20px;
        }

        .change-type {
            margin-bottom: 20px;
        }

        .change-type-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .change-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .type-added .change-type-header { color: #7b2cbf; }
        .type-changed .change-type-header { color: #9d4edd; }
        .type-fixed .change-type-header { color: #c77dff; }
        .type-removed .change-type-header { color: #e0aaff; }

        .change-items {
            list-style: none;
            padding-left: 34px;
        }

        .change-items li {
            padding: 8px 0;
            color: #d0d0d0;
            position: relative;
        }

        .change-items li:before {
            content: "→";
            position: absolute;
            left: -20px;
            color: #9d4edd;
        }

        .future-badge {
            background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .version-number {
                font-size: 1.2rem;
            }

            .logo {
                width: 80px;
                height: 80px;
            }

            header {
                padding: 20px 10px;
            }

            .version-header {
                padding: 15px;
            }

            .changes-section {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .version-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="data/assets/logo.png" alt="Cheathub Logo" class="logo" onclick="window.location.href='https://blockhunter0007.github.io/cheathub'">
            <h1>Changelog</h1>
            <p class="subtitle">All changes and updates at a glance</p>
        </header>

        <div id="changelog-container"></div>
    </div>

    <script>
        const changelogData = {
            "updates": {
                "00.00.03": {
                    "version": "00.00.03",
                    "released_at": "2025-02-15",
                    "changes": [
                        {
                            "type": "added",
                            "items": [
                                "Music Player",
                                "free resize"
                            ]
                        },
                        {
                            "type": "changed",
                            "items": [
                            ]
                        },
                        {
                            "type": "fixed",
                            "items": [
                            ]
                        },
                        {
                            "type": "removed",
                            "items": [
                                "Login requirement"
                            ]
                        }
                    ]
                },
                "00.00.01": {
                    "version": "00.00.01",
                    "released_at": "2025-02-15",
                    "changes": [
                        {
                            "type": "added",
                            "items": [
                                "Changelog page",
                                "Offline detection feature",
                                "Offline support",
                                "Open Cheathub Folder button",
                                "Open Changelog button"
                            ]
                        },
                        {
                            "type": "changed",
                            "items": [
                                "Downloads will now run in one function (minor performance upgrade)",
                                "Structure of buttons in info changed"
                            ]
                        },
                        {
                            "type": "fixed",
                            "items": [
                                "Offline exit error",
                                "Fixed UI glitches"
                            ]
                        },
                        {
                            "type": "removed",
                            "items": [
                                "Outdated download module"
                            ]
                        }
                    ]
                }
            },
            "future": {
                "00.00.04": {
                    "version": "00.00.04",
                    "released_at": "2025-03-30",
                    "changes": [
                        {
                            "type": "added",
                            "items": [
                                "User profiles",
                                "Multi-language support",
                                "Linux + MacOS + Android support (Linux in near future)"
"timer"
                            ]
                        },
                        {
                            "type": "changed",
                            "items": [
                                "Improved download speeds",
                                "Enhanced UI animations"
                            ]
                        },
                        {
                            "type": "fixed",
                            "items": [
                                "Minor bug fixes and performance improvements"
                            ]
                        }
                    ]
                }
            }
        };

        const icons = {
            added: "✨",
            changed: "🔄",
            fixed: "🔧",
            removed: "🗑️"
        };

        const typeLabels = {
            added: "Added",
            changed: "Changed",
            fixed: "Fixed",
            removed: "Removed"
        };

        function createVersionCard(version, data, isFuture = false) {
            const card = document.createElement('div');
            card.className = 'version-card';
            
            let changesHTML = '';
            data.changes.forEach(change => {
                const items = change.items.map(item => `<li>${item}</li>`).join('');
                changesHTML += `
                    <div class="change-type type-${change.type}">
                        <div class="change-type-header">
                            <span class="change-icon">${icons[change.type]}</span>
                            <span>${typeLabels[change.type]}</span>
                        </div>
                        <ul class="change-items">
                            ${items}
                        </ul>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="version-header">
                    <div class="version-info">
                        <span class="version-number">v${data.version}</span>
                        ${isFuture ? '<span class="future-badge">PLANNED</span>' : ''}
                        <span class="version-date">${new Date(data.released_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                    </div>
                    <span class="expand-icon">▼</span>
                </div>
                <div class="version-content">
                    <div class="changes-section">
                        ${changesHTML}
                    </div>
                </div>
            `;

            card.querySelector('.version-header').addEventListener('click', () => {
                card.classList.toggle('expanded');
            });

            return card;
        }

        function renderChangelog() {
            const container = document.getElementById('changelog-container');
            
            // Released Updates
            const releasedSection = document.createElement('div');
            releasedSection.className = 'section';
            releasedSection.innerHTML = '<h2 class="section-title">Released Updates</h2>';
            
            Object.entries(changelogData.updates).reverse().forEach(([version, data]) => {
                releasedSection.appendChild(createVersionCard(version, data, false));
            });
            
            container.appendChild(releasedSection);

            // Future Updates
            const futureSection = document.createElement('div');
            futureSection.className = 'section';
            futureSection.innerHTML = '<h2 class="section-title">Planned Updates</h2>';
            
            Object.entries(changelogData.future).reverse().forEach(([version, data]) => {
                futureSection.appendChild(createVersionCard(version, data, true));
            });
            
            container.appendChild(futureSection);
        }

        renderChangelog();
    </script>
</body>
</html>
