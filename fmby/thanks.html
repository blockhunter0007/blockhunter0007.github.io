<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks for downloading — Blockhunter0007</title>
<meta name="description" content="Your download is ready.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Klee+One:wght@400;600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ─────────────────────────────────────────
   CSS CUSTOM PROPERTIES
───────────────────────────────────────── */
:root {
  --font-display: 'Klee One', cursive;
  --font-body: 'Nunito', sans-serif;
  --font-handwrite: 'Caveat', cursive;

  /* Light Mode */
  --bg-primary: #fdf6f0;
  --bg-secondary: #fff0f5;
  --bg-card: rgba(255, 255, 255, 0.72);
  --bg-card-hover: rgba(255, 255, 255, 0.92);
  --text-primary: #3a2a35;
  --text-secondary: #7a5a6a;
  --text-muted: #b8909a;
  --accent-1: #e8a0bf;
  --accent-2: #c9b1e8;
  --accent-3: #f7c5d5;
  --accent-glow: rgba(232, 160, 191, 0.35);
  --border-soft: rgba(232, 160, 191, 0.25);
  --shadow-soft: 0 4px 24px rgba(180, 120, 150, 0.12);
  --shadow-hover: 0 8px 40px rgba(180, 120, 150, 0.22);
  --grad-hero: linear-gradient(135deg, #fdf0f8 0%, #f5e8ff 50%, #fde8ef 100%);
  --particle-opacity: 0.5;
  --header-bg: rgba(253, 246, 240, 0.82);
}

[data-theme="dark"] {
  --bg-primary: #120a18;
  --bg-secondary: #1a0f22;
  --bg-card: rgba(30, 16, 42, 0.75);
  --bg-card-hover: rgba(40, 22, 58, 0.90);
  --text-primary: #f0e6f8;
  --text-secondary: #c4a8d8;
  --text-muted: #8a6a9a;
  --accent-1: #c084e0;
  --accent-2: #e080b0;
  --accent-3: #9060c8;
  --accent-glow: rgba(192, 132, 224, 0.25);
  --border-soft: rgba(192, 132, 224, 0.18);
  --shadow-soft: 0 4px 32px rgba(100, 40, 160, 0.22);
  --shadow-hover: 0 8px 48px rgba(120, 50, 200, 0.35);
  --grad-hero: linear-gradient(135deg, #130a1a 0%, #1e0d2e 50%, #150a20 100%);
  --particle-opacity: 0.4;
  --header-bg: rgba(18, 10, 24, 0.85);
}

/* ─────────────────────────────────────────
   RESET & BASE
───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.75;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.5s ease, color 0.4s ease;
}

a {
  color: var(--accent-1);
  text-decoration: none;
  transition: color 0.2s;
}
a:hover { color: var(--accent-2); }

img { max-width: 100%; display: block; }

/* ─────────────────────────────────────────
   PARTICLE CANVAS
───────────────────────────────────────── */
#particle-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: var(--particle-opacity);
}

/* ─────────────────────────────────────────
   HEADER
───────────────────────────────────────── */
.site-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  background: var(--header-bg);
  border-bottom: 1px solid var(--border-soft);
  padding: 0 2rem;
  height: 64px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  transition: background 0.5s ease, border-color 0.4s ease;
}

.header-left .site-name {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.01em;
  opacity: 0.8;
  transition: opacity 0.2s;
}
.header-left .site-name:hover { opacity: 1; }

.header-center { text-align: center; }
.header-center .logo-text {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.2;
}
.header-center .logo-sub {
  font-family: var(--font-body);
  font-size: 0.68rem;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  font-weight: 400;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  justify-content: flex-end;
}

.icon-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 50%;
  width: 38px; height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.05rem;
  color: var(--text-secondary);
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  box-shadow: var(--shadow-soft);
}
.icon-btn:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent-1);
  box-shadow: 0 0 12px var(--accent-glow);
  transform: scale(1.08);
  color: var(--accent-1);
}
.icon-btn:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 2px; }

/* ─────────────────────────────────────────
   MAIN LAYOUT
───────────────────────────────────────── */
main {
  position: relative;
  z-index: 1;
  flex: 1;
  padding-top: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

/* Hero gradient backdrop */
.page-bg {
  position: absolute;
  inset: 0;
  background: var(--grad-hero);
  transition: background 0.6s ease;
}

.hero-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
.hero-glow-1 {
  width: 520px; height: 520px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  top: -100px; left: -100px;
  animation: driftA 18s ease-in-out infinite;
}
.hero-glow-2 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(201,177,232,0.2) 0%, transparent 70%);
  bottom: -60px; right: -60px;
  animation: driftB 22s ease-in-out infinite;
}

@keyframes driftA {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, 30px) scale(1.05); }
  66% { transform: translate(-20px, 50px) scale(0.97); }
}
@keyframes driftB {
  0%, 100% { transform: translate(0, 0) scale(1); }
  40% { transform: translate(-30px, -25px) scale(1.08); }
  70% { transform: translate(20px, 20px) scale(0.95); }
}

/* ─────────────────────────────────────────
   THANK YOU CARD
───────────────────────────────────────── */
.ty-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 2rem 1.5rem 3rem;
  animation: fadeInUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ty-card {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 2rem;
  padding: 2.8rem 2.4rem 2.4rem;
  text-align: center;
  box-shadow: var(--shadow-hover);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
}

/* Success ring */
.success-ring {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-glow), rgba(201,177,232,0.18));
  border: 1.5px solid var(--border-soft);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.2rem;
  animation: ringPop 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
}
@keyframes ringPop {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.success-ring svg {
  width: 28px; height: 28px;
  color: var(--accent-1);
  stroke: var(--accent-1);
}

/* Status badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-family: var(--font-handwrite);
  font-size: 0.98rem;
  color: var(--accent-1);
  background: var(--accent-glow);
  border: 1px solid var(--border-soft);
  border-radius: 2rem;
  padding: 0.25rem 0.9rem;
  margin-bottom: 1.4rem;
  letter-spacing: 0.04em;
}
.badge-dot {
  width: 7px; height: 7px;
  background: var(--accent-1);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-glow);
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* Heading */
.ty-eyebrow {
  font-family: var(--font-handwrite);
  font-size: 1.1rem;
  color: var(--accent-1);
  letter-spacing: 0.04em;
  margin-bottom: 0.5rem;
}
.ty-title {
  font-family: var(--font-display);
  font-size: clamp(1.7rem, 4vw, 2.3rem);
  font-weight: 600;
  line-height: 1.3;
  color: var(--text-primary);
  margin-bottom: 0.75rem;
}
.ty-title em {
  font-style: italic;
  color: var(--accent-1);
}
.ty-desc {
  font-size: 0.97rem;
  color: var(--text-secondary);
  line-height: 1.8;
  margin-bottom: 1.8rem;
}

/* File info box */
.file-box {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  background: var(--bg-card-hover);
  border: 1px solid var(--border-soft);
  border-radius: 1rem;
  padding: 0.9rem 1.1rem;
  margin-bottom: 1.4rem;
  text-align: left;
}
.file-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--accent-glow), rgba(201,177,232,0.15));
  border: 1px solid var(--border-soft);
  border-radius: 0.75rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.file-icon svg {
  width: 18px; height: 18px;
  color: var(--accent-1);
  stroke: var(--accent-1);
}
.file-info { min-width: 0; }
.file-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 0.15rem;
}
.file-name {
  font-family: var(--font-handwrite);
  font-size: 1.05rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Download button */
.btn-download {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  width: 100%;
  padding: 0.85rem 1.8rem;
  border-radius: 2rem;
  font-family: var(--font-body);
  font-size: 0.97rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  color: #fff;
  border: none;
  box-shadow: 0 4px 20px var(--accent-glow);
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.2s;
  cursor: pointer;
  margin-bottom: 0.85rem;
}
.btn-download:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px var(--accent-glow);
  color: #fff;
}
.btn-download:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 3px; }
.btn-download.disabled {
  opacity: 0.45;
  cursor: not-allowed;
  pointer-events: none;
}
.btn-download svg {
  width: 18px; height: 18px;
  stroke: currentColor;
  flex-shrink: 0;
}

/* Back link */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: var(--font-handwrite);
  font-size: 1rem;
  color: var(--text-muted);
  transition: color 0.2s;
}
.back-link:hover { color: var(--accent-1); }

/* Divider */
.divider {
  border: none;
  border-top: 1px solid var(--border-soft);
  margin: 1.8rem 0;
}

/* Next steps */
.next-label {
  font-family: var(--font-handwrite);
  font-size: 1rem;
  color: var(--accent-1);
  letter-spacing: 0.06em;
  margin-bottom: 0.9rem;
}
.step-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  text-align: left;
}
.step-list li {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  font-size: 0.93rem;
  color: var(--text-secondary);
  line-height: 1.65;
}
.step-num {
  flex-shrink: 0;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 0.12rem;
}

/* Error card */
.error-card {
  position: relative;
  z-index: 2;
  max-width: 480px;
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 2rem;
  padding: 3rem 2.4rem;
  text-align: center;
  box-shadow: var(--shadow-hover);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  animation: fadeInUp 0.7s ease both;
  margin: 0 1.5rem;
}
.error-icon { font-size: 2.5rem; margin-bottom: 1rem; }
.error-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.6rem;
}
.error-body {
  color: var(--text-secondary);
  font-size: 0.95rem;
  margin-bottom: 1.2rem;
  line-height: 1.7;
}
.error-code {
  display: inline-block;
  font-family: var(--font-handwrite);
  font-size: 1rem;
  color: var(--accent-1);
  background: var(--accent-glow);
  border: 1px solid var(--border-soft);
  border-radius: 0.6rem;
  padding: 0.4rem 0.9rem;
  letter-spacing: 0.02em;
}

/* ─────────────────────────────────────────
   FOOTER
───────────────────────────────────────── */
footer {
  position: relative;
  z-index: 2;
  border-top: 1px solid var(--border-soft);
  padding: 1.2rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.footer-copy {
  font-family: var(--font-handwrite);
  font-size: 0.98rem;
  color: var(--text-muted);
}
.footer-links {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
}
.footer-link {
  font-size: 0.85rem;
  color: var(--text-muted);
  transition: color 0.2s;
}
.footer-link:hover { color: var(--accent-1); }

/* ─────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────── */
@media (max-width: 520px) {
  .ty-card { padding: 2rem 1.4rem 1.8rem; }
  .site-header { padding: 0 1rem; }
  footer { padding: 1rem 1rem; }
  .footer-links { gap: 0.8rem; }
}
</style>
</head>
<body>

<canvas id="particle-canvas" aria-hidden="true"></canvas>

<!-- HEADER -->
<header class="site-header">
  <div class="header-left">
    <a href="/" class="site-name">Blockhunter0007</a>
  </div>
  <div class="header-center">
    <div class="logo-text">✦ soft place</div>
    <div class="logo-sub">a quiet corner online</div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span>
    </button>
  </div>
</header>

<!-- MAIN -->
<main id="main">
  <div class="page-bg"></div>
  <div class="hero-glow hero-glow-1"></div>
  <div class="hero-glow hero-glow-2"></div>
  <!-- injected by JS -->
</main>

<!-- FOOTER -->
<footer>
  <span class="footer-copy">© 2025 Blockhunter0007</span>
  <div class="footer-links">
    <a href="/fmby/legal.html#terms" class="footer-link">Terms ↗</a>
    <a href="/fmby/legal.html#privacy" class="footer-link">Privacy ↗</a>
    <a href="mailto:blockhunter.software@gmail.com" class="footer-link">Contact ↗</a>
    <a href="/fmby/" class="footer-link">Home ↗</a>
  </div>
</footer>

<script>
/* ─────────────────────────────────────────────────────────────────
   CONFIG
   Set BASE_URL to your file hosting base path.
   Final download link = BASE_URL + filename
   Usage: thankyou.html?productname=DayLog&filename=DayLog_v1.0.0_win.zip
───────────────────────────────────────────────────────────────── */
const BASE_URL = 'https://blockhunter0007.github.io/downloads/'; // ← change this

/* ─────────────────────────────────────────────────────────────────
   PARSE URL PARAMS
───────────────────────────────────────────────────────────────── */
const params      = new URLSearchParams(window.location.search);
const productName = params.get('productname') || '';
const filename    = params.get('filename')    || '';
const downloadURL = filename ? BASE_URL + filename : '';

/* ─────────────────────────────────────────────────────────────────
   RENDER
───────────────────────────────────────────────────────────────── */
function render() {
  const main = document.getElementById('main');

  if (!productName && !filename) {
    main.innerHTML += `
      <div class="error-card">
        <div class="error-icon">✦</div>
        <h2 class="error-title">Missing parameters</h2>
        <p class="error-body">This page requires a <code>productname</code> and <code>filename</code> in the URL to work.</p>
        <span class="error-code">?productname=AppName&amp;filename=file.zip</span>
      </div>`;
    document.title = 'Oops — Blockhunter0007';
    return;
  }

  document.title = `Thanks for downloading ${productName || filename} — Blockhunter0007`;

  main.innerHTML += `
    <div class="ty-wrap">
      <div class="ty-card">

        <!-- Success ring -->
        <div class="success-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>

        <!-- Badge -->
        <div class="status-badge">
          <span class="badge-dot"></span>
          download ready
        </div>

        <!-- Heading -->
        <p class="ty-eyebrow">you're all set ✨</p>
        <h1 class="ty-title">
          Thanks for downloading<br>
          <em>${escapeHTML(productName || filename)}</em>
        </h1>
        <p class="ty-desc">
          Your download should start automatically. If it doesn't, use the button below.
        </p>

        <!-- File info -->
        ${filename ? `
        <div class="file-box">
          <div class="file-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
          </div>
          <div class="file-info">
            <div class="file-label">File</div>
            <div class="file-name" title="${escapeHTML(filename)}">${escapeHTML(filename)}</div>
          </div>
        </div>` : ''}

        <!-- Download button -->
        <a
          id="downloadBtn"
          href="${escapeHTML(downloadURL)}"
          class="btn-download${!downloadURL ? ' disabled' : ''}"
          download
          ${!downloadURL ? 'aria-disabled="true"' : ''}
        >
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="8 17 12 21 16 17"/>
            <line x1="12" y1="21" x2="12" y2="7"/>
            <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
          </svg>
          Download ${escapeHTML(productName || filename)}
        </a>

        <a href="/fmby/download.html${productName ? '#' + productName.toLowerCase() : ''}" class="back-link">
          ← back to download page
        </a>

        <hr class="divider" />

        <!-- Next steps -->
        <div class="next-steps">
          <div class="next-label">what's next ✦</div>
          <ul class="step-list">
            <li>
              <span class="step-num">1</span>
              Open the downloaded file and follow the installation instructions.
            </li>
            <li>
              <span class="step-num">2</span>
              If your browser blocked the download, check your downloads folder or allow the file in your browser settings.
            </li>
            <li>
              <span class="step-num">3</span>
              Having trouble? Reach out at
              <a href="mailto:blockhunter.software@gmail.com" style="color:var(--accent-1);margin-left:3px;">blockhunter.software@gmail.com</a>
            </li>
          </ul>
        </div>

      </div>
    </div>`;

  /* Auto-trigger download */
  if (downloadURL) {
    setTimeout(() => {
      const link = document.createElement('a');
      link.href = downloadURL;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }, 800);
  }
}

/* ─────────────────────────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────────────────────────── */
function escapeHTML(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ─────────────────────────────────────────────────────────────────
   THEME
───────────────────────────────────────────────────────────────── */
let currentTheme = localStorage.getItem('bh_theme') || 'dark';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeIcon').textContent = theme === 'dark' ? '🌙' : '☀️';
}
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('bh_theme', currentTheme);
  applyTheme(currentTheme);
}

/* ─────────────────────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────────────────────── */
applyTheme(currentTheme);
render();

/* ─────────────────────────────────────────
   PARTICLE SYSTEM
───────────────────────────────────────── */
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, particles = [];

  const SHAPES = [
    { type: 'heart',   weight: 40 },
    { type: 'star',    weight: 20 },
    { type: 'sparkle', weight: 15 },
    { type: 'circle',  weight: 10 },
    { type: 'text',    weight: 15 }
  ];

  const EASTER_EGGS = [
    "You matter.", "Take your time.", "I'm glad you're here.",
    "Your feelings are allowed.", "Some thoughts need quiet places.",
    "It's okay to rest.", "The internet can still be soft.",
    "You survived every hard day.", "Be gentle with yourself.",
    "Small things matter too."
  ];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function weightedShape() {
    const total = SHAPES.reduce((s, x) => s + x.weight, 0);
    let r = Math.random() * total;
    for (const s of SHAPES) {
      r -= s.weight;
      if (r <= 0) return s.type;
    }
    return 'heart';
  }

  function makeParticle() {
    const type = weightedShape();
    return {
      type,
      x: Math.random() * W,
      y: Math.random() * H + H,
      size: type === 'text' ? 0 : (Math.random() * 10 + 5),
      fontSize: Math.random() * 11 + 10,
      text: EASTER_EGGS[Math.floor(Math.random() * EASTER_EGGS.length)],
      speed: Math.random() * 0.4 + 0.1,
      drift: (Math.random() - 0.5) * 0.3,
      opacity: Math.random() * 0.5 + 0.2,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01,
      phase: Math.random() * Math.PI * 2,
      wobble: Math.random() * 0.008 + 0.002,
    };
  }

  function drawHeart(ctx, x, y, size) {
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.3);
    ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
    ctx.bezierCurveTo(x - size, y + size * 0.65, x, y + size, x, y + size);
    ctx.bezierCurveTo(x, y + size, x + size, y + size * 0.65, x + size, y + size * 0.3);
    ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
    ctx.fill();
  }

  function drawStar(ctx, x, y, size) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
      const ax = x + Math.cos(angle) * size;
      const ay = y + Math.sin(angle) * size;
      const ia = angle + Math.PI / 5;
      const ix = x + Math.cos(ia) * size * 0.4;
      const iy = y + Math.sin(ia) * size * 0.4;
      i === 0 ? ctx.moveTo(ax, ay) : ctx.lineTo(ax, ay);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.fill();
  }

  function getAccentColor() {
    return getComputedStyle(document.documentElement).getPropertyValue('--accent-1').trim() || '#e8a0bf';
  }
  function getAccent2Color() {
    return getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim() || '#c9b1e8';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const a1 = getAccentColor();
    const a2 = getAccent2Color();
    const colors = [a1, a2, '#f7c5d5', '#d4a0f0'];

    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
      ctx.strokeStyle = ctx.fillStyle;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);

      if (p.type === 'heart') {
        drawHeart(ctx, 0, 0, p.size * 0.5);
      } else if (p.type === 'star') {
        drawStar(ctx, 0, 0, p.size * 0.5);
      } else if (p.type === 'sparkle') {
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = (i * Math.PI) / 2;
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * p.size, Math.sin(a) * p.size);
        }
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else if (p.type === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'text') {
        ctx.font = `${p.fontSize}px 'Caveat', cursive`;
        ctx.fillStyle = a1;
        ctx.globalAlpha = p.opacity * 0.6;
        ctx.fillText(p.text, 0, 0);
      }
      ctx.restore();
    }
  }

  function update() {
    const time = performance.now() * 0.001;
    for (const p of particles) {
      p.y -= p.speed;
      p.x += p.drift + Math.sin(time * p.wobble * 100 + p.phase) * 0.3;
      p.rotation += p.rotSpeed;
      p.opacity = 0.15 + Math.abs(Math.sin(time * 0.3 + p.phase)) * 0.45;
      if (p.y < -60 || p.x < -100 || p.x > W + 100) {
        p.x = Math.random() * W;
        p.y = H + 50;
        p.speed = Math.random() * 0.4 + 0.1;
        p.drift = (Math.random() - 0.5) * 0.3;
      }
    }
  }

  function tick() { update(); draw(); requestAnimationFrame(tick); }

  function init() {
    resize();
    const count = prefersReduced ? 0 : Math.min(Math.floor(W * H / 22000), 60);
    particles = Array.from({ length: count }, () => {
      const p = makeParticle();
      p.y = Math.random() * H;
      return p;
    });
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  document.fonts.ready.then(init);
})();
</script>
</body>
