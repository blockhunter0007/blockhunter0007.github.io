<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Projekte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a0033 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            text-align: center;
            border-bottom: 3px solid #8b00ff;
            box-shadow: 0 4px 20px rgba(139, 0, 255, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ffffff, #b366ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #b366ff;
            font-size: 1.1rem;
        }

        .nav {
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 2px solid #4d0080;
        }

        .nav-btn {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #4d0080, #8b00ff);
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 255, 0.5);
            background: linear-gradient(135deg, #6600b3, #a64dff);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #8b00ff, #b366ff);
            box-shadow: 0 5px 20px rgba(139, 0, 255, 0.6);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .project-card {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(139, 0, 255, 0.3);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: #8b00ff;
            box-shadow: 0 10px 30px rgba(139, 0, 255, 0.4);
        }

        .project-header {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: linear-gradient(135deg, #2d0050, #4d0080);
        }

        .project-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .project-title {
            font-size: 1.5rem;
            color: #b366ff;
            margin-bottom: 0.5rem;
        }

        .project-date {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .project-description {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .project-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .project-images img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(139, 0, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .project-images img:hover {
            border-color: #8b00ff;
            transform: scale(1.05);
        }

        .project-button {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #8b00ff, #b366ff);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .project-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(139, 0, 255, 0.5);
        }

        .no-projects {
            text-align: center;
            padding: 3rem;
            color: #888;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Meine Projekte</h1>
        <p>Entdecke meine neuesten Arbeiten</p>
    </div>

    <div class="nav" id="nav">
        <button class="nav-btn active" onclick="filterProjects('alle')">Alle Projekte</button>
    </div>

    <div class="container">
        <div class="projects-grid" id="projectsGrid"></div>
    </div>

    <script>
        // Beispiel JSON-Daten (ersetze dies mit deiner echten JSON-Datei)
        const projectsData = {
            "app-cheathub": {
                "project_name": "Cheathub",
                "last_updated": "15.11.2025",
                "description": "Eine innovative cheat Anwendung für Windows mit intuitiver Benutzeroberfläche.",
                "url": "https://blockhunter0007.github.io/cheathub",
                "images": [],
                "headder imange": "headder.png"
            }
        };

        function renderProjects(data) {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';

            const projects = Object.entries(data);
            
            if (projects.length === 0) {
                grid.innerHTML = '<div class="no-projects">Keine Projekte verfügbar</div>';
                return;
            }

            projects.forEach(([projectKey, project]) => {
                const card = document.createElement('div');
                card.className = 'project-card';

                // Header Image
                let headerHTML = '';
                if (project['headder imange'] && project['headder imange'].trim() !== '') {
                    headerHTML = `
                        <div class="project-header">
                            <img src="assets/${projectKey}/${project['headder imange']}" 
                                 alt="${project.project_name}"
                                 onerror="this.parentElement.style.display='none'">
                        </div>
                    `;
                }

                // Project Images
                let imagesHTML = '';
                if (project.images && project.images.length > 0) {
                    const imagesGrid = project.images.map(img => 
                        `<img src="assets/${projectKey}/${img}" 
                              alt="${project.project_name}"
                              onerror="this.style.display='none'">`
                    ).join('');
                    
                    imagesHTML = `<div class="project-images">${imagesGrid}</div>`;
                }

                card.innerHTML = `
                    ${headerHTML}
                    <div class="project-content">
                        <h2 class="project-title">${project.project_name}</h2>
                        <div class="project-date">Aktualisiert: ${project.last_updated}</div>
                        <p class="project-description">${project.description}</p>
                        ${imagesHTML}
                        <a href="${project.url}" target="_blank" class="project-button">
                            Projekt ansehen →
                        </a>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filterProjects(category) {
            // Entferne active Klasse von allen Buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Füge active Klasse zum geklickten Button hinzu
            event.target.classList.add('active');

            // Hier kannst du die Filterlogik implementieren
            if (category === 'alle') {
                renderProjects(projectsData);
            }
            // Weitere Kategorien können hier hinzugefügt werden
        }

        // Lade Projekte beim Start
        window.onload = () => {
            renderProjects(projectsData);
        };

        // Alternative: Lade Projekte aus externer JSON-Datei

                const data = await response.json();

            } catch (error) {
                console.error('Fehler beim Laden der Projekte:', error);
                document.getElementById('projectsGrid').innerHTML = 
                    '<div class="no-projects">Fehler beim Laden der Projekte</div>';
            }
        }
        
        window.onload = loadProjects;
        */
    </script>
</body>
</html>
