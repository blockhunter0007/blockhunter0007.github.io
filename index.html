<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockhunter0007 – a quiet place on the internet</title>
<meta name="description" content="Soft projects made with care. A personal homepage by Blockhunter0007.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@300;400;500;600&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ─── CSS Variables ─────────────────────────────────────── */
:root {
  --bg:          #fdf8f5;
  --bg2:         #fef0f4;
  --surface:     rgba(255,255,255,0.72);
  --surface2:    rgba(255,240,248,0.6);
  --border:      rgba(220,180,200,0.3);
  --text:        #3a2a35;
  --text-soft:   #7a5a6a;
  --text-muted:  #b08898;
  --accent:      #e87fa0;
  --accent2:     #c97bb8;
  --accent-soft: rgba(232,127,160,0.15);
  --accent-glow: rgba(232,127,160,0.3);
  --gold:        #d4956a;
  --radius:      20px;
  --radius-lg:   32px;
  --shadow:      0 4px 32px rgba(180,100,130,0.12);
  --shadow-lg:   0 12px 60px rgba(180,100,130,0.18);
  --font-body:   'Nunito', sans-serif;
  --font-serif:  'Lora', serif;
  --font-hand:   'Caveat', cursive;
  --transition:  0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

[data-theme="dark"] {
  --bg:          #16101c;
  --bg2:         #1e1428;
  --surface:     rgba(36,24,48,0.85);
  --surface2:    rgba(48,30,64,0.6);
  --border:      rgba(140,80,180,0.2);
  --text:        #f0e4f5;
  --text-soft:   #c4a8d8;
  --text-muted:  #8a6aa0;
  --accent:      #c67de8;
  --accent2:     #9b6ec4;
  --accent-soft: rgba(198,125,232,0.12);
  --accent-glow: rgba(198,125,232,0.25);
  --gold:        #e8b87a;
  --shadow:      0 4px 32px rgba(100,40,140,0.3);
  --shadow-lg:   0 12px 60px rgba(100,40,140,0.4);
}

/* ─── Reset ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

/* ─── Typography ─────────────────────────────────────────── */
h1, h2, h3 { font-family: var(--font-serif); font-weight: 500; line-height: 1.25; }
h1 { font-size: clamp(2.2rem, 6vw, 4rem); }
h2 { font-size: clamp(1.5rem, 3.5vw, 2.2rem); }
h3 { font-size: 1.05rem; }
p { color: var(--text-soft); }
.hand { font-family: var(--font-hand); }

/* ─── Background Canvas ──────────────────────────────────── */
#bg-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.55;
}

/* ─── Layout ─────────────────────────────────────────────── */
.wrapper { position: relative; z-index: 1; }
.container { max-width: 1080px; margin: 0 auto; padding: 0 clamp(1.2rem, 5vw, 3rem); }
section { padding: clamp(4rem, 8vw, 7rem) 0; }

/* ─── Nav ────────────────────────────────────────────────── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 1.1rem 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  background: rgba(253,248,245,0.82);
  transition: background var(--transition);
}
[data-theme="dark"] nav { background: rgba(22,16,28,0.88); }

.nav-inner {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
}

.nav-left {
  font-family: var(--font-hand);
  font-size: 1rem;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-left:hover { color: var(--accent); }

.nav-center { text-align: center; }

.nav-title {
  font-family: var(--font-serif);
  font-size: 1.7rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1;
  text-shadow: 0 0 20px var(--accent-glow);
}

.nav-by {
  font-family: var(--font-hand);
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 0.1rem;
}

.nav-right {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 0.5rem;
}

.icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.42rem 0.9rem;
  font-family: var(--font-body);
  font-size: 0.8rem;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  white-space: nowrap;
}
.icon-btn:hover, .icon-btn:focus-visible {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}
.icon-btn:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

/* ─── Snip ───────────────────────────────────────────────── */
.snip {
  font-family: var(--font-hand);
  font-size: 1rem;
  color: var(--text-muted);
  text-align: center;
  padding: 0.5rem 0 1.5rem;
  opacity: 0.85;
  font-style: italic;
}

/* ─── Section header ─────────────────────────────────────── */
.section-head { text-align: center; margin-bottom: clamp(2.5rem, 5vw, 4rem); }
.section-head h2 { margin-bottom: 0.6rem; }
.section-head p { max-width: 520px; margin: 0 auto; }

/* ─── Divider ────────────────────────────────────────────── */
.divider {
  width: 50px;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  margin: 0 auto 1.5rem;
  opacity: 0.5;
}

/* ─── Hero ───────────────────────────────────────────────── */
.hero {
  min-height: 92vh;
  display: flex;
  align-items: center;
  padding: 5rem 0 4rem;
  position: relative;
}

.hero-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1.8rem;
}

.hero-label {
  font-family: var(--font-hand);
  font-size: 1.05rem;
  color: var(--accent);
  letter-spacing: 0.04em;
  opacity: 0.85;
}

.hero-headline {
  max-width: 760px;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 55%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  max-width: 520px;
  font-size: 1.05rem;
  line-height: 1.85;
  color: var(--text-soft);
}

.hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
  justify-content: center;
}

.badge {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.32rem 0.85rem;
  font-size: 0.78rem;
  color: var(--text-soft);
  letter-spacing: 0.02em;
}

.hero-btns {
  display: flex;
  gap: 0.9rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 0.3rem;
}

/* ─── Buttons ────────────────────────────────────────────── */
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 0.9rem 2.2rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  box-shadow: 0 6px 28px var(--accent-glow);
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.15);
  opacity: 0;
  transition: opacity 0.2s;
}
.btn-primary:hover::after, .btn-primary:focus-visible::after { opacity: 1; }
.btn-primary:hover, .btn-primary:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 10px 40px var(--accent-glow);
  outline: none;
}

.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.7rem 1.6rem;
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--text-soft);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.2s;
  backdrop-filter: blur(8px);
}
.btn-secondary:hover, .btn-secondary:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
  outline: none;
}

/* ─── About ──────────────────────────────────────────────── */
.about-card {
  max-width: 680px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(2rem, 5vw, 3.2rem);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.about-card::after {
  content: '♡';
  position: absolute;
  bottom: -1.5rem;
  right: 2rem;
  font-size: 8rem;
  color: var(--accent-soft);
  line-height: 1;
  pointer-events: none;
}

.about-header {
  display: flex;
  align-items: center;
  gap: 1.1rem;
  margin-bottom: 1.8rem;
}

.about-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  flex-shrink: 0;
  box-shadow: 0 4px 20px var(--accent-glow);
}

.about-name {
  font-family: var(--font-hand);
  font-size: 1.25rem;
  color: var(--text);
  display: block;
}

.about-role {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.about-body p {
  color: var(--text-soft);
  line-height: 1.9;
  margin-bottom: 1.1rem;
}
.about-body p:last-child { margin-bottom: 0; }
.about-body em {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--text);
}

/* ─── Status / Devlog ────────────────────────────────────── */
.status-section { padding-bottom: 0; }

.status-cards {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  max-width: 600px;
  margin: 0 auto;
}

.status-entry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.4rem 1rem 1.2rem;
  backdrop-filter: blur(12px);
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  transition: box-shadow 0.25s;
}
.status-entry:hover { box-shadow: var(--shadow); }

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 0.55rem;
  flex-shrink: 0;
  box-shadow: 0 0 8px var(--accent-glow);
  animation: pulse-dot 2.5s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.status-text {
  font-family: var(--font-hand);
  font-size: 1.05rem;
  color: var(--text-soft);
  line-height: 1.5;
}

/* ─── Projects ───────────────────────────────────────────── */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.2rem;
}

.project-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  backdrop-filter: blur(12px);
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  position: relative;
}

.project-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: 0;
  transition: opacity 0.3s;
}

.project-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(232,127,160,0.25);
}
.project-card:hover::before { opacity: 1; }
.project-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.project-img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
  background: var(--accent-soft);
}

.project-img-placeholder {
  width: 100%;
  height: 140px;
  background: linear-gradient(135deg, var(--accent-soft), rgba(201,123,184,0.12));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
}

.project-body {
  padding: 1.4rem 1.5rem 1.5rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.project-name {
  font-family: var(--font-serif);
  font-size: 1.1rem;
  font-weight: 500;
  color: var(--text);
}

.project-desc {
  font-size: 0.9rem;
  color: var(--text-soft);
  line-height: 1.7;
  flex: 1;
}

.project-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.3rem;
}

.tag {
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 0.2rem 0.7rem;
  font-size: 0.72rem;
  color: var(--accent);
  font-family: var(--font-body);
}

/* ─── Socials ────────────────────────────────────────────── */
.socials-intro {
  text-align: center;
  max-width: 480px;
  margin: 0 auto 2.5rem;
}
.socials-intro p { margin-top: 0.6rem; }

.socials-row {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
}

.social-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.6rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  text-decoration: none;
  color: var(--text-soft);
  font-size: 0.92rem;
  font-weight: 500;
  transition: all 0.25s;
  backdrop-filter: blur(12px);
  min-width: 160px;
}
.social-btn:hover, .social-btn:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-2px);
  box-shadow: 0 6px 28px var(--accent-glow);
  outline: none;
}

.social-icon {
  width: 28px;
  height: 28px;
  object-fit: contain;
  border-radius: 6px;
  flex-shrink: 0;
}

.social-icon-placeholder {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  flex-shrink: 0;
}

/* ─── Footer ─────────────────────────────────────────────── */
footer {
  border-top: 1px solid var(--border);
  padding: 3rem 0 2rem;
  position: relative;
  overflow: hidden;
}

.footer-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.2rem;
  text-align: center;
}

.footer-logo {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  color: var(--accent);
  text-shadow: 0 0 16px var(--accent-glow);
}

.footer-tagline {
  font-family: var(--font-hand);
  font-size: 1rem;
  color: var(--text-muted);
  font-style: italic;
}

.footer-note {
  font-size: 0.8rem;
  color: var(--text-muted);
  max-width: 440px;
  line-height: 1.6;
}

.footer-hearts {
  font-size: 1.1rem;
  letter-spacing: 0.4rem;
  opacity: 0.5;
}

/* ─── Scroll reveal ──────────────────────────────────────── */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.65s ease, transform 0.65s ease;
}
.reveal.visible {
  opacity: 1;
  transform: none;
}

/* ─── Animations ─────────────────────────────────────────── */
@keyframes float-up {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes pulse-glow {
  0%, 100% { text-shadow: 0 0 20px var(--accent-glow); }
  50% { text-shadow: 0 0 40px var(--accent-glow), 0 0 60px var(--accent-glow); }
}
@keyframes fade-in-up {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-inner > * { animation: fade-in-up 0.7s ease both; }
.hero-inner > *:nth-child(1) { animation-delay: 0.05s; }
.hero-inner > *:nth-child(2) { animation-delay: 0.15s; }
.hero-inner > *:nth-child(3) { animation-delay: 0.25s; }
.hero-inner > *:nth-child(4) { animation-delay: 0.35s; }
.hero-inner > *:nth-child(5) { animation-delay: 0.45s; }

/* ─── Loading states ─────────────────────────────────────── */
.loading-shimmer {
  background: linear-gradient(90deg, var(--surface) 25%, var(--accent-soft) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius);
  height: 1em;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ─── Responsive ─────────────────────────────────────────── */
@media (max-width: 640px) {
  .nav-inner { grid-template-columns: auto 1fr auto; }
  .nav-left { font-size: 0.82rem; }
  .nav-title { font-size: 1.35rem; }
  .icon-btn span { display: none; }
  .hero { min-height: 80vh; }
}
</style>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<div class="wrapper">

  <!-- ── NAV ─────────────────────────────────────── -->
  <nav aria-label="Main navigation">
    <div class="container">
      <div class="nav-inner">
        <a href="#" class="nav-left" aria-label="Home">Blockhunter0007</a>

        <div class="nav-center">
          <div class="nav-title" aria-label="Blockhunter0007">Blockhunter0007</div>
          <div class="nav-by">by Blockhunter Software</div>
        </div>

        <div class="nav-right">
          <button class="icon-btn" id="music-btn" aria-label="Toggle music" style="display:none">
            <span id="music-icon">🎵</span>
            <span id="music-label"></span>
          </button>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle dark/light mode">
            <span id="theme-icon">🌙</span>
            <span id="theme-label"></span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── HERO ────────────────────────────────────── -->
  <section class="hero" aria-labelledby="hero-headline">
    <div class="container">
      <div class="hero-inner">
        <div class="hero-label" id="hero-label"></div>
        <h1 class="hero-headline" id="hero-headline"></h1>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="hero-badges" id="hero-badges"></div>
        <div class="hero-btns">
          <a href="#projects" class="btn-primary" id="hero-btn-projects">
            <span>✦</span> <span id="btn-projects-text"></span>
          </a>
          <a href="#socials" class="btn-secondary" id="hero-btn-socials">
            <span id="btn-socials-text"></span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- ── ABOUT ────────────────────────────────────── -->
  <section aria-labelledby="about-heading">
    <div class="container">
      <div class="section-head reveal">
        <div class="divider"></div>
        <h2 id="about-heading"></h2>
      </div>
      <div class="about-card reveal">
        <div class="about-header">
          <div class="about-avatar" aria-hidden="true">🌙</div>
          <div>
            <span class="about-name">Blockhunter0007</span>
            <span class="about-role" id="about-role"></span>
          </div>
        </div>
        <div class="about-body" id="about-body"></div>
      </div>
      <p class="snip" id="about-snip"></p>
    </div>
  </section>

  <!-- ── STATUS ───────────────────────────────────── -->
  <section class="status-section" aria-labelledby="status-heading">
    <div class="container">
      <div class="section-head reveal">
        <div class="divider"></div>
        <h2 id="status-heading"></h2>
        <p id="status-sub"></p>
      </div>
      <div class="status-cards reveal" id="status-cards">
        <div class="loading-shimmer" style="height:56px;"></div>
      </div>
      <p class="snip" id="status-snip"></p>
    </div>
  </section>

(function initMusic() {
  const btn = document.getElementById('music-btn');
  const icon = document.getElementById('music-icon');
  const label = document.getElementById('music-label');
  let audio = null;
  let muted = false;
  let loaded = false;

  try {
    audio = new Audio('assets/theme.ogg');
    audio.loop = true;
    audio.volume = 0;

    audio.addEventListener('canplaythrough', () => {
      if (loaded) return;
      loaded = true;
      btn.style.display = 'flex';
      label.textContent = T.music_on;
      icon.textContent = '🎵';

      audio.play().then(() => {
        // Fade in
        let v = 0;
        const fade = setInterval(() => {
          v = Math.min(v + 0.02, 0.25);
          audio.volume = v;
          if (v >= 0.25) clearInterval(fade);
        }, 80);
      }).catch(() => {});
    });

    audio.addEventListener('error', () => {
      btn.style.display = 'none';
    });

    audio.load();
  } catch(e) {
    btn.style.display = 'none';
    return;
  }

  btn.addEventListener('click', () => {
    if (!audio) return;
    muted = !muted;

    if (muted) {
      let v = audio.volume;
      const fade = setInterval(() => {
        v = Math.max(v - 0.03, 0);
        audio.volume = v;
        if (v <= 0) { clearInterval(fade); audio.pause(); }
      }, 60);
      icon.textContent = '🔇';
      label.textContent = T.music_off;
    } else {
      audio.play().catch(() => {});
      let v = 0;
      audio.volume = 0;
      const fade = setInterval(() => {
        v = Math.min(v + 0.02, 0.25);
        audio.volume = v;
        if (v >= 0.25) clearInterval(fade);
      }, 80);
      icon.textContent = '🎵';
      label.textContent = T.music_on;
    }
  });
})();

/* ════════════════════════════════════════════════════════════
   BACKGROUND PARTICLES
════════════════════════════════════════════════════════════ */
(function bgParticles() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const easterEggs = [
    'You matter.',
    'Take your time.',
    "I'm glad you're here.",
    'Your feelings are allowed to exist.',
    'Some thoughts need quiet places.',
    'You survived every difficult day so far.',
    "It's okay to rest.",
    'The internet can still be soft.',
    'You are enough.',
    'Be gentle with yourself.',
  ];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function randomType() {
    const r = Math.random();
    if (r < 0.70) return 'heart';
    if (r < 0.84) return 'star';
    if (r < 0.95) return 'sparkle';
    return 'egg';
  }

  function createParticle() {
    const type = randomType();
    return {
      type,
      x: Math.random() * W,
      y: H + 30,
      size: type === 'egg' ? 11 : (7 + Math.random() * 13),
      speed: 0.25 + Math.random() * 0.55,
      drift: (Math.random() - 0.5) * 0.35,
      opacity: 0,
      maxOpacity: 0.10 + Math.random() * 0.16,
      fadeIn: true,
      text: type === 'egg' ? easterEggs[Math.floor(Math.random() * easterEggs.length)] : '',
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.008,
    };
  }

  const SYMBOLS = { heart: '♡', star: '✦', sparkle: '✧' };

  function getColor(type) {
    if (isDark) {
      if (type === 'heart') return 'rgba(198,125,232,0.65)';
      if (type === 'star') return 'rgba(220,180,255,0.5)';
      return 'rgba(160,110,210,0.45)';
    } else {
      if (type === 'heart') return 'rgba(232,127,160,0.65)';
      if (type === 'star') return 'rgba(212,149,106,0.5)';
      return 'rgba(190,110,150,0.45)';
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      if (p.type === 'egg') {
        ctx.font = `${p.size}px 'Caveat', cursive`;
        ctx.fillStyle = isDark ? 'rgba(220,180,255,0.45)' : 'rgba(180,100,140,0.38)';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, 0, 0);
      } else {
        ctx.font = `${p.size}px serif`;
        ctx.fillStyle = getColor(p.type);
        ctx.textAlign = 'center';
        ctx.fillText(SYMBOLS[p.type] || '♡', 0, 0);
      }
      ctx.restore();
    });
  }

  function tick() {
    if (!prefersReducedMotion) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.y -= p.speed;
        p.x += p.drift;
        p.rotation += p.rotSpeed;
        if (p.fadeIn) {
          p.opacity = Math.min(p.opacity + 0.007, p.maxOpacity);
          if (p.opacity >= p.maxOpacity) p.fadeIn = false;
        }
        if (p.y < -50) particles.splice(i, 1);
      }
      if (particles.length < 55 && Math.random() < 0.25) particles.push(createParticle());
    }
    draw();
    requestAnimationFrame(tick);
  }

  resize();
  window.addEventListener('resize', resize);

  // Initial spread
  for (let i = 0; i < 38; i++) {
    const p = createParticle();
    p.y = Math.random() * H;
    p.opacity = Math.random() * p.maxOpacity;
    p.fadeIn = false;
    particles.push(p);
  }
  tick();
})();

/* ════════════════════════════════════════════════════════════
   SCROLL REVEAL
════════════════════════════════════════════════════════════ */
(function scrollReveal() {
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReducedMotion) {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
})();
